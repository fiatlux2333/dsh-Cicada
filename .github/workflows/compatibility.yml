name: Harness compatibility regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm compat:check --sdk-only
      - run: pnpm check
      - run: pnpm test:ui
      - run: pnpm pack:plugin
      - run: pnpm check:package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-ui-failure
          path: |
            test-results/
            artifacts/ui/
