name: Harness compatibility regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      host_version:
        description: Exact DSH version to probe (blank to test the declared hosts)
        type: string
        required: false
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Select workspace
        id: select
        env:
          CANDIDATE: ${{ inputs.host_version }}
        run: |
          $dir = $env:GITHUB_WORKSPACE
          $target = $env:CANDIDATE
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $target = npm view '@deepseek-ai/dsh@next' version --registry=https://registry.npmjs.org
            if ($LASTEXITCODE -ne 0 -or !$target) { throw 'Could not resolve the official next tag' }
          }
          if ($target) {
            $dir = node scripts/prepare-compatibility.mjs "$target"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "dir=$dir" >> $env:GITHUB_OUTPUT
      - name: Check SDK, types, tests and build
        working-directory: ${{ steps.select.outputs.dir }}
        run: |
          pnpm compat:check --sdk-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check
      - run: pnpm test:ui
        working-directory: ${{ steps.select.outputs.dir }}
      - run: pnpm pack:plugin
        working-directory: ${{ steps.select.outputs.dir }}
      - run: pnpm check:package
        working-directory: ${{ steps.select.outputs.dir }}
      - name: Check Windows DPAPI and monitor ownership
        working-directory: ${{ steps.select.outputs.dir }}
        run: |
          node scripts/check-windows-safe.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import { spawnSync } from 'node:child_process'; import { fixtureEnvironment } from './scripts/harness-fixture.mjs'; const result = spawnSync(process.execPath, ['scripts/check-windows-safe.ts'], { env: fixtureEnvironment(process.env, process.cwd()), stdio: 'inherit' }); process.exit(result.status ?? 1);"
      - name: Smoke-test the same tarball on each declared Windows Web host
        working-directory: ${{ steps.select.outputs.dir }}
        run: |
          $report = node scripts/check-compatibility.mjs --sdk-only | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$report.hosts) { throw 'Missing validated host list' }
          foreach ($version in $report.hosts) {
            $prefix = Join-Path $env:RUNNER_TEMP "dsh-$version"
            npm install --prefix "$prefix" --registry=https://registry.npmjs.org --no-audit --no-fund "@deepseek-ai/dsh@$version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pnpm test:harness --npm-prefix "$prefix" "$version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: failure() && steps.select.outcome == 'success'
        with:
          name: compatibility-failure
          path: |
            ${{ steps.select.outputs.dir }}/test-results/
            ${{ steps.select.outputs.dir }}/artifacts/ui/
            ${{ steps.select.outputs.dir }}/artifacts/harness-owned-*/host.log
            ${{ steps.select.outputs.dir }}/artifacts/harness-owned-*/ui/
